plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rasyidcode.dotaitemmerge'
    compileSdk 35
    ndkVersion '28.0.13004108'

    defaultConfig {
        applicationId 'com.rasyidcode.dotaitemmerge'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DCMAKE_BUILD_TYPE=Release'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildTypes {
        debug {
            debuggable true
        }
    }
}
